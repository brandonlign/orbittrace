name: GhostStream inspect official MDC checker

on:
  pull_request:
    paths:
      - ".github/workflows/ghoststream-mdc-checker-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download official checker archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official_checker
          curl --fail --location --retry 3 \
            --user-agent 'GhostStream-MDC-checker-audit/1.0' \
            https://ceresiaumdc.ta3.sk/downloads/source_programs/checking_program.zip \
            --output official_checker/checking_program.zip
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import zipfile
          p = Path("official_checker/checking_program.zip")
          data = p.read_bytes()
          assert data.startswith(b"PK")
          print("archive_bytes", len(data))
          print("archive_sha256", hashlib.sha256(data).hexdigest())
          with zipfile.ZipFile(p) as zf:
              bad = zf.testzip()
              assert bad is None, bad
              print("members")
              for item in zf.infolist():
                  print(item.filename, item.file_size, f"crc={item.CRC:08x}")
              zf.extractall("official_checker/extracted")
          PY

      - name: Display source and input contract
        shell: bash
        run: |
          set -euo pipefail
          find official_checker/extracted -maxdepth 3 -type f -print -exec file {} \;
          for file in $(find official_checker/extracted -type f \( -iname '*.f' -o -iname '*.for' -o -iname '*.f90' -o -iname '*.txt' -o -iname '*.dat' -o -iname '*readme*' \)); do
            echo "===== $file ====="
            sed -n '1,260p' "$file"
          done

      - name: Upload official checker source
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-official-mdc-checker-source
          path: official_checker/
          if-no-files-found: error
          retention-days: 30
