name: GhostStream recover runner sources

on:
  push:
    branches:
      - agent/ghoststream-pilot
    paths:
      - .github/workflows/ghoststream-recover-runner-sources.yml
  pull_request:
    paths:
      - .github/workflows/ghoststream-recover-runner-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-runner-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GhostStream branch
        uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - name: Check out recovery-gate source at immutable commit
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-worker
          ref: 4175e5187fcc6faf3d1befb099a9e35be96850f2
          path: _ghoststream_source/pr56

      - name: Check out novel-search source at immutable commit
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-worker
          ref: 39972b5fe0cf4d47092d3caa2b3ced12bedb065e
          path: _ghoststream_source/pr57

      - name: Preserve exact recovered trees
        shell: bash
        run: |
          set -euo pipefail
          target="pilots/ghoststream/recovered_pipeline"
          rm -rf "$target"
          mkdir -p "$target/pr56_runner" "$target/pr57_novel"
          cp -a _ghoststream_source/pr56/ghoststream_runner/. "$target/pr56_runner/"
          cp -a _ghoststream_source/pr57/ghoststream_novel/. "$target/pr57_novel/"
          rm -rf "$target/pr56_runner/.git" "$target/pr57_novel/.git"

          test "$(find "$target/pr56_runner" -type f | wc -l | tr -d ' ')" -eq 14
          test "$(find "$target/pr57_novel" -type f | wc -l | tr -d ' ')" -eq 35
          test -f "$target/pr56_runner/validate_candidates.py"
          test -f "$target/pr56_runner/multiyear_confirmation.py"
          test -f "$target/pr57_novel/run_novel_search_fixed.py"
          test -f "$target/pr57_novel/validate_april_candidate.py"
          test -f "$target/pr57_novel/validate_april_source_null.py"
          test -f "$target/pr57_novel/bootstrap_april_solution.py"
          test -f "$target/pr57_novel/specification_curve_april.py"
          test -f "$target/pr57_novel/flux_handoff/make_ghoststream_flux_catalog.py"

      - name: Write immutable provenance and inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("pilots/ghoststream/recovered_pipeline")
          sources = {
              "pr56_runner": {
                  "repository": "brandonlign/remotion-worker",
                  "pull_request": 56,
                  "source_path": "ghoststream_runner",
                  "commit": "4175e5187fcc6faf3d1befb099a9e35be96850f2",
              },
              "pr57_novel": {
                  "repository": "brandonlign/remotion-worker",
                  "pull_request": 57,
                  "source_path": "ghoststream_novel",
                  "commit": "39972b5fe0cf4d47092d3caa2b3ced12bedb065e",
              },
          }
          for name, metadata in sources.items():
              directory = root / name
              files = []
              for path in sorted(p for p in directory.rglob("*") if p.is_file()):
                  payload = path.read_bytes()
                  files.append({
                      "path": path.relative_to(directory).as_posix(),
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  })
              metadata["file_count"] = len(files)
              metadata["files"] = files

          manifest = {
              "status": "RECOVERED_FROM_IMMUTABLE_GITHUB_PR_COMMITS",
              "destination_branch": "agent/ghoststream-pilot",
              "sources": sources,
              "preservation_note": (
                  "These are exact snapshots of the temporary GitHub Actions runner trees that "
                  "generated the GhostStream discovery, validation, and downstream audit outputs. "
                  "They are preserved before any refactoring."
              ),
          }
          (root / "SOURCE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")

          readme = """# Recovered GhostStream source pipeline

This directory preserves the previously missing executable GhostStream source trees exactly as they existed in two temporary `brandonlign/remotion-worker` pull-request commits.

- `pr56_runner/`: recovery gate, known-shower and injection controls, blind scans, candidate validation, official-catalog matching, uncertainty clones, and multi-year confirmation; source PR #56 at commit `4175e5187fcc6faf3d1befb099a9e35be96850f2`.
- `pr57_novel/`: all-season discovery, frozen April membership selection, activity/orbit nulls, bootstrap, geographic splits, specification curve, independent-archive checks, parent screening, and flux handoff; source PR #57 at commit `39972b5fe0cf4d47092d3caa2b3ced12bedb065e`.

`SOURCE_MANIFEST.json` records every recovered file with its SHA-256 digest. These snapshots must remain unchanged. Any repaired or consolidated implementation should be created separately and compared against them.

Recovery changes the project status: the original executable code was not present in the `isef` branch, but it was still preserved in the temporary runner PR commits. End-to-end reproducibility still requires a clean immutable-input rerun and reconciliation against the committed result package.
"""
          (root / "README.md").write_text(readme)
          PY

      - name: Syntax-check every recovered Python file
        run: python -m compileall -q pilots/ghoststream/recovered_pipeline

      - name: Commit recovered source snapshots
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/recovered_pipeline
          if git diff --cached --quiet; then
            echo "Recovered snapshots already match the immutable source commits."
          else
            git commit -m "Recover GhostStream runner source code"
            git push origin HEAD:agent/ghoststream-pilot
          fi
