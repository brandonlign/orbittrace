name: GhostStream primary reproduction PR check

on:
  pull_request:
    paths:
      - "pilots/ghoststream/reconstruction/RECONSTRUCTION_PROTOCOL.md"
      - "pilots/ghoststream/reconstruction/reproduce_primary_gmn.py"
      - "pilots/ghoststream/reconstruction/run_primary_gmn_tls_compat.py"
      - "pilots/ghoststream/reconstruction/probe_gmn_query_transport.py"
      - "pilots/ghoststream/april_stream/mdc/GhostStream_April_95_GMN_lookup.csv"
      - ".github/workflows/ghoststream-primary-reproduction-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-primary-gmn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile reconstruction
        run: |
          python -m py_compile \
            pilots/ghoststream/reconstruction/reproduce_primary_gmn.py \
            pilots/ghoststream/reconstruction/run_primary_gmn_tls_compat.py \
            pilots/ghoststream/reconstruction/probe_gmn_query_transport.py

      - name: Probe official GMN query transport
        run: |
          python pilots/ghoststream/reconstruction/probe_gmn_query_transport.py \
            2>&1 | tee ghoststream_gmn_query_probe.log

      - name: Run frozen primary reproduction
        id: reproduce
        shell: bash
        run: |
          set +e
          python pilots/ghoststream/reconstruction/run_primary_gmn_tls_compat.py \
            2>&1 | tee ghoststream_primary_reproduction.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > ghoststream_primary_reproduction_exit_code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Validate generated evidence
        if: always()
        run: |
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/primary_gmn_reproduction.json
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/PRIMARY_GMN_REPRODUCTION.md
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/reproduced_members_2019_2026.csv
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/reproduced_activity_tables.csv
          python -m json.tool \
            pilots/ghoststream/reconstruction/primary_gmn_reproduction/primary_gmn_reproduction.json \
            >/dev/null
          cat pilots/ghoststream/reconstruction/primary_gmn_reproduction/PRIMARY_GMN_REPRODUCTION.md

      - name: Upload complete reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-primary-gmn-reproduction-pr
          path: |
            pilots/ghoststream/reconstruction/primary_gmn_reproduction/
            ghoststream_gmn_query_probe.log
            ghoststream_primary_reproduction.log
            ghoststream_primary_reproduction_exit_code.txt
          if-no-files-found: error
          retention-days: 90

      - name: Preserve fail-closed status
        if: always()
        shell: bash
        run: |
          status="${{ steps.reproduce.outputs.exit_code }}"
          if [[ -z "$status" ]]; then
            exit 1
          fi
          exit "$status"
