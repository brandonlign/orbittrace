name: GhostStream EDMOND archive-index audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-archive-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile audit
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/recover_current_edmond.py \
            pilots/ghoststream/april_stream/edmond_2024/audit_archive_indices.py

      - name: Query attachment and archive indexes
        shell: bash
        run: |
          set +e
          cd pilots/ghoststream/april_stream/edmond_2024
          python audit_archive_indices.py \
            --output-dir "$GITHUB_WORKSPACE/edmond_archive_audit" \
            2>&1 | tee "$GITHUB_WORKSPACE/edmond_archive_audit.log"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$GITHUB_WORKSPACE/edmond_archive_audit"
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/edmond_archive_audit/exit_code.txt"
          if [[ "$status" != "0" && "$status" != "3" ]]; then
            exit "$status"
          fi

      - name: Display verdict
        if: always()
        run: |
          test -f edmond_archive_audit/archive_index_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("edmond_archive_audit/archive_index_audit.json").read_text())
          print(json.dumps({
              "verdict": result["verdict"],
              "wordpress_media_records": sum(len(x.get("media", [])) for x in result["wordpress_queries"]),
              "sitemap_matches": sum(len(x.get("matches", [])) for x in result["sitemap_queries"]),
              "wayback_captures": sum(len(x.get("captures", [])) for x in result["wayback_cdx"]),
              "common_crawl_records": sum(len(x.get("records", [])) for x in result["common_crawl_queries"]),
              "accepted_archives": len(result["accepted_archives"]),
          }, indent=2))
          PY

      - name: Upload archival evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-edmond-2024-archive-index-audit
          path: |
            edmond_archive_audit/
            edmond_archive_audit.log
          if-no-files-found: error
          retention-days: 30
