name: GhostStream recovered external reproduction

on:
  push:
    branches:
      - agent/ghoststream-pilot
    paths:
      - .github/workflows/ghoststream-recovered-external-reproduction.yml
  pull_request:
    paths:
      - .github/workflows/ghoststream-recovered-external-reproduction.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce-external-archives-and-parent-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out GhostStream evidence branch
        uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - name: Check out exact recovered source
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-worker
          ref: 39972b5fe0cf4d47092d3caa2b3ced12bedb065e
          path: _ghoststream_exact_source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install recovered environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r _ghoststream_exact_source/ghoststream_novel/requirements.txt
          python -m pip freeze | sort | tee ghoststream_external_environment.txt

      - name: Verify external source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _ghoststream_exact_source rev-parse HEAD)" = "39972b5fe0cf4d47092d3caa2b3ced12bedb065e"
          sha256sum \
            _ghoststream_exact_source/ghoststream_novel/validate_cams_legacy.py \
            _ghoststream_exact_source/ghoststream_novel/validate_cams_legacy_fixed.py \
            _ghoststream_exact_source/ghoststream_novel/validate_independent_catalogs.py \
            _ghoststream_exact_source/ghoststream_novel/validate_independent_catalogs_v2.py \
            _ghoststream_exact_source/ghoststream_novel/synthesize_independent_archives.py \
            _ghoststream_exact_source/ghoststream_novel/screen_parent_and_inspect_cams.py \
            _ghoststream_exact_source/ghoststream_novel/requirements.txt \
            | tee ghoststream_external_source_sha256.txt
          python -m py_compile \
            _ghoststream_exact_source/ghoststream_novel/validate_cams_legacy.py \
            _ghoststream_exact_source/ghoststream_novel/validate_cams_legacy_fixed.py \
            _ghoststream_exact_source/ghoststream_novel/validate_independent_catalogs.py \
            _ghoststream_exact_source/ghoststream_novel/validate_independent_catalogs_v2.py \
            _ghoststream_exact_source/ghoststream_novel/synthesize_independent_archives.py \
            _ghoststream_exact_source/ghoststream_novel/screen_parent_and_inspect_cams.py

      - name: Run corrected legacy CAMS validation
        run: |
          python _ghoststream_exact_source/ghoststream_novel/validate_cams_legacy_fixed.py \
            2>&1 | tee ghoststream_external_01_cams.log

      - name: Run corrected permanent SonotaCo and linked EDMOND audit
        run: |
          python _ghoststream_exact_source/ghoststream_novel/validate_independent_catalogs_v2.py \
            2>&1 | tee ghoststream_external_02_independent_catalogs.log

      - name: Run exploratory CAMS plus SonotaCo synthesis
        run: |
          python _ghoststream_exact_source/ghoststream_novel/synthesize_independent_archives.py \
            2>&1 | tee ghoststream_external_03_synthesis.log

      - name: Run current NASA JPL parent screen
        run: |
          python _ghoststream_exact_source/ghoststream_novel/screen_parent_and_inspect_cams.py \
            2>&1 | tee ghoststream_external_04_parent.log

      - name: Compare recovered archive results and classify current parent screen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import shutil
          from pathlib import Path

          import pandas as pd

          ROOT = Path("pilots/ghoststream/reconstruction/exact_external")
          if ROOT.exists():
              shutil.rmtree(ROOT)
          ROOT.mkdir(parents=True)

          def load_json(path: str):
              return json.loads(Path(path).read_text())

          def close(name: str, actual: float, expected: float, *, atol: float = 0.0, rtol: float = 0.0):
              actual = float(actual)
              if not math.isclose(actual, float(expected), abs_tol=atol, rel_tol=rtol):
                  raise AssertionError(f"{name}: expected {expected}, found {actual}")
              return actual

          cams = load_json("ghoststream_cams_validation/cams_validation.json")
          assert cams["strict_members"] == 6
          assert cams["member_counts_by_year"] == {"2011": 2, "2012": 4}
          assert cams["verdict"] == "APRIL_STREAM_NOT_REPLICATED_IN_LEGACY_CAMS"
          assert cams["passed"] is False
          cams_activity = close("CAMS activity p", cams["activity"]["p"], 0.01251, rtol=0.01)
          cams_shift = close("CAMS shifted-window p", cams["shifted_windows"]["empirical_p"], 0.02041, atol=0.00002)
          cams_median = close("CAMS median D", cams["orbit"]["observed"]["median_d"], 0.05068, atol=0.0001)
          cams_orbit_p = close("CAMS orbit-null p", cams["orbit"]["null_p"], 0.0001, atol=1e-12)

          independent = load_json("ghoststream_independent_validation/independent_catalog_validation.json")
          son = independent["sonotaco"]
          assert son["members"] == 4
          assert son["member_counts_by_year"] == {"2022": 2, "2023": 1, "2025": 1}
          assert son["passed"] is False
          son_activity = close("SonotaCo activity p", son["activity"]["p"], 0.00715, rtol=0.01)
          son_shift = close("SonotaCo shifted-window p", son["shifted_windows"]["empirical_p"], 0.02041, atol=0.00002)
          son_median = close("SonotaCo median D", son["orbit"]["observed"]["median_d"], 0.03614, atol=0.0001)
          son_orbit_p = close("SonotaCo orbit-null p", son["orbit"]["null_p"], 0.0001, atol=1e-12)

          synthesis = load_json("ghoststream_independent_synthesis/independent_archive_synthesis.json")
          assert synthesis["verdict"] == "INDEPENDENT_ARCHIVES_JOINTLY_SUPPORT_APRIL_STREAM"
          assert synthesis["passed"] is True
          assert synthesis["members"] == 10
          assert synthesis["active_years"] == [2011, 2012, 2022, 2023, 2025]
          pooled_activity = close("pooled archive activity p", synthesis["pooled_activity"]["p"], 1.62184e-4, rtol=0.01)
          pooled_shift = close("pooled archive shifted-window p", synthesis["pooled_shifted_windows"]["empirical_p"], 0.02041, atol=0.00002)
          pooled_median = close("pooled archive median D", synthesis["pooled_orbit"]["observed"]["median_d"], 0.04879, atol=0.0001)
          pooled_orbit_p = close("pooled archive orbit-null p", synthesis["pooled_orbit"]["null_p"], 0.00005, atol=1e-12)
          pooled_gmn_d = close("pooled medoid distance to GMN", synthesis["pooled_orbit"]["distance_to_gmn_refined_orbit"], 0.01723, atol=0.0001)

          reproduced_members = pd.read_csv("ghoststream_independent_synthesis/pooled_independent_members.csv")
          preserved_members = pd.read_csv("pilots/ghoststream/april_stream/independent_archive_members.csv")
          reproduced_ids = {
              (str(row.source), int(row.year), str(row.id))
              for row in reproduced_members.itertuples(index=False)
          }
          preserved_ids = {
              (str(row.source), int(row.year), str(row.id))
              for row in preserved_members.itertuples(index=False)
          }
          assert reproduced_ids == preserved_ids, {
              "missing": sorted(preserved_ids - reproduced_ids),
              "additional": sorted(reproduced_ids - preserved_ids),
          }

          parent = load_json("ghoststream_parent_cams/parent_and_cams.json")
          jpl = parent["jpl_parent_screen"]
          assert int(jpl["count_reported"]) == int(jpl["rows_fetched"])
          assert int(jpl["valid_orbits"]) > 0
          top = jpl["top_100"]
          assert top
          distances = [float(item["d_stream"]) for item in top]
          assert distances == sorted(distances)
          parent_status = (
              "NO_CURRENT_JPL_OBJECT_AT_D_LE_0_15"
              if int(jpl["d_le_0_15"]) == 0
              else "CURRENT_CLOSE_JPL_OBJECT_REQUIRES_EXPERT_REVIEW"
          )

          checks = {
              "cams": {
                  "classification": "supportive_not_individually_decisive",
                  "members": 6,
                  "member_counts": {"2011": 2, "2012": 4},
                  "activity_p": cams_activity,
                  "shifted_window_p": cams_shift,
                  "median_orbit_d": cams_median,
                  "orbit_null_p": cams_orbit_p,
              },
              "sonotaco": {
                  "classification": "supportive_below_minimum_member_count",
                  "members": 4,
                  "member_counts": {"2022": 2, "2023": 1, "2025": 1},
                  "activity_p": son_activity,
                  "shifted_window_p": son_shift,
                  "median_orbit_d": son_median,
                  "orbit_null_p": son_orbit_p,
              },
              "exploratory_pooled_synthesis": {
                  "verdict": synthesis["verdict"],
                  "members": 10,
                  "member_id_set_exact": True,
                  "activity_p": pooled_activity,
                  "shifted_window_p": pooled_shift,
                  "median_orbit_d": pooled_median,
                  "orbit_null_p": pooled_orbit_p,
                  "distance_to_gmn_refined_orbit": pooled_gmn_d,
              },
              "edmond": {
                  "classification": "separate_provenance_limited_supplement",
                  "live_linked_audit_verdict": independent.get("edmond", {}).get("passed"),
                  "download_metadata": independent.get("edmond_downloads"),
              },
              "current_parent_screen": {
                  "status": parent_status,
                  "broad_box_count": int(jpl["count_reported"]),
                  "valid_orbits": int(jpl["valid_orbits"]),
                  "d_le_0_15": int(jpl["d_le_0_15"]),
                  "d_le_0_25": int(jpl["d_le_0_25"]),
                  "nearest": top[0],
              },
          }

          source_dirs = {
              "cams": Path("ghoststream_cams_validation"),
              "independent_catalogs": Path("ghoststream_independent_validation"),
              "pooled_synthesis": Path("ghoststream_independent_synthesis"),
              "parent_screen": Path("ghoststream_parent_cams"),
          }
          for name, source in source_dirs.items():
              if not source.is_dir():
                  raise RuntimeError(f"Missing output directory: {source}")
              shutil.copytree(source, ROOT / name)
          shutil.copy2("ghoststream_external_environment.txt", ROOT / "environment.txt")
          shutil.copy2("ghoststream_external_source_sha256.txt", ROOT / "source_sha256.txt")

          files = []
          for path in sorted(item for item in ROOT.rglob("*") if item.is_file()):
              payload = path.read_bytes()
              files.append({
                  "path": path.relative_to(ROOT).as_posix(),
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
              })
          manifest = {
              "status": "RECOVERED_EXTERNAL_ARCHIVE_REPRODUCTION",
              "source_repository": "brandonlign/remotion-worker",
              "source_commit": "39972b5fe0cf4d47092d3caa2b3ced12bedb065e",
              "checks": checks,
              "files": files,
          }
          (ROOT / "external_reproduction.json").write_text(json.dumps(manifest, indent=2) + "\n")

          lines = [
              "# GhostStream recovered external reproduction", "",
              "**Archive verdict:** `RECOVERED_EXTERNAL_ARCHIVE_REPRODUCTION`", "",
              "The recovered source exactly regenerated the preserved six CAMS and four SonotaCo events. "
              "Neither archive is overstated as a standalone decisive replication: CAMS narrowly misses "
              "the frozen activity threshold, and SonotaCo is below the frozen minimum member count.", "",
              f"- CAMS: 6 members; activity p={cams_activity:.8g}; orbit-null p={cams_orbit_p:.8g}",
              f"- SonotaCo: 4 members; activity p={son_activity:.8g}; orbit-null p={son_orbit_p:.8g}",
              f"- Exploratory pooled synthesis: 10 exact members; activity p={pooled_activity:.8g}; orbit-null p={pooled_orbit_p:.8g}",
              f"- Pooled medoid distance to refined GMN orbit: {pooled_gmn_d:.6f}",
              f"- Current JPL parent-screen status: `{parent_status}`", "",
              "EDMOND is retained separately as provenance-limited supplementary evidence and is not counted as a clean third-network replication.", "",
          ]
          (ROOT / "EXTERNAL_REPRODUCTION.md").write_text("\n".join(lines))
          print(json.dumps(checks, indent=2))
          PY

      - name: Upload recovered external evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-recovered-external-reproduction
          path: |
            pilots/ghoststream/reconstruction/exact_external/
            ghoststream_external_*.log
          if-no-files-found: error
          retention-days: 90

      - name: Commit recovered external evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/reconstruction/exact_external
          if git diff --cached --quiet; then
            echo "Recovered external evidence already matches the committed package."
            exit 0
          fi
          git commit -m "Reproduce GhostStream external evidence"
          git pull --rebase origin agent/ghoststream-pilot
          git push origin HEAD:agent/ghoststream-pilot
