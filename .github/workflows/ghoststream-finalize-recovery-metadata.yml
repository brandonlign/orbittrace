name: GhostStream finalize recovery metadata

on:
  push:
    branches:
      - agent/ghoststream-pilot
    paths:
      - "pilots/ghoststream/reconstruction/finalize_recovery_metadata.py"
      - "pilots/ghoststream/reconstruction/exact_recovered/**"
      - "pilots/ghoststream/reconstruction/exact_downstream/**"
      - "pilots/ghoststream/reconstruction/exact_external/**"
      - "pilots/ghoststream/reconstruction/exact_method_controls/**"
      - "pilots/ghoststream/reconstruction/exact_method_controls_v3/**"
      - "pilots/ghoststream/reconstruction/exact_blind_rediscovery/**"
      - "pilots/ghoststream/reconstruction/blind_wrapper_fix.json"
      - ".github/workflows/ghoststream-finalize-recovery-metadata.yml"
  pull_request:
    paths:
      - "pilots/ghoststream/reconstruction/finalize_recovery_metadata.py"
      - "pilots/ghoststream/reconstruction/exact_recovered/**"
      - "pilots/ghoststream/reconstruction/exact_downstream/**"
      - "pilots/ghoststream/reconstruction/exact_external/**"
      - "pilots/ghoststream/reconstruction/exact_method_controls/**"
      - "pilots/ghoststream/reconstruction/exact_method_controls_v3/**"
      - "pilots/ghoststream/reconstruction/exact_blind_rediscovery/**"
      - "pilots/ghoststream/reconstruction/blind_wrapper_fix.json"
      - ".github/workflows/ghoststream-finalize-recovery-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile finalizer
        run: python -m py_compile pilots/ghoststream/reconstruction/finalize_recovery_metadata.py

      - name: Finalize machine-readable metadata
        shell: bash
        run: |
          set -euo pipefail
          python pilots/ghoststream/reconstruction/finalize_recovery_metadata.py \
            2>&1 | tee ghoststream_finalize_metadata.log

      - name: Validate finalized records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          final = json.loads(Path("pilots/ghoststream/results/ghoststream_final_summary.json").read_text())
          candidate = json.loads(Path("pilots/ghoststream/april_stream/candidate_solution.json").read_text())
          assert final["overall_verdict"] == "GO_SCIENTIFIC_CANDIDATE_PUBLICATION_HOLD"
          assert final["blind_discovery_reproduction"]["status"] == "EXACT_2026_BLIND_REDISCOVERY"
          assert final["blind_discovery_reproduction"]["full_gate_survivors"] == 1
          assert final["method_control_reconciliation"]["historical_v2"]["aggregate_verdict"] == "NO_GO_DEGENERATE_PARENT_CLUSTER"
          assert final["method_control_reconciliation"]["corrected_independent_2024"]["status"] == "CORRECTED_INDEPENDENT_YEAR_CONTROL_PASS"
          repro = final["reproducibility_status"]
          assert repro["discovery_lineage_reproduced"] is True
          assert repro["blind_discovery_lineage_status"] == "passed_with_minimal_non_scientific_wrapper_repair"
          assert repro["publication_or_formal_mdc_submission_allowed"] is False
          assert candidate["computational_recovery"]["blind_discovery"] == "EXACT_2026_BLIND_REDISCOVERY"
          assert candidate["method_control_reconciliation"]["corrected_independent_2024"]["passed"] is True
          assert candidate["novelty_audit"]["current_jpl_screen"]["objects_with_orbit_distance_le_0_15"] == 0
          print(json.dumps({
              "blind": final["blind_discovery_reproduction"]["status"],
              "method": final["method_control_reconciliation"]["corrected_independent_2024"]["status"],
              "publication_allowed": repro["publication_or_formal_mdc_submission_allowed"],
          }, indent=2))
          PY

      - name: Upload finalization evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-finalized-recovery-metadata
          path: |
            pilots/ghoststream/results/ghoststream_final_summary.json
            pilots/ghoststream/april_stream/candidate_solution.json
            ghoststream_finalize_metadata.log
          if-no-files-found: error
          retention-days: 90

      - name: Commit finalized metadata
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pilots/ghoststream/results/ghoststream_final_summary.json \
            pilots/ghoststream/april_stream/candidate_solution.json
          if git diff --cached --quiet; then
            echo "Recovery metadata already finalized."
            exit 0
          fi
          git commit -m "Finalize GhostStream recovery metadata"
          git pull --rebase origin agent/ghoststream-pilot
          git push origin HEAD:agent/ghoststream-pilot
