name: GhostStream primary GMN reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ghoststream-pilot
    paths:
      - pilots/ghoststream/reconstruction/RECONSTRUCTION_PROTOCOL.md
      - pilots/ghoststream/reconstruction/reproduce_primary_gmn.py
      - pilots/ghoststream/april_stream/mdc/GhostStream_April_95_GMN_lookup.csv
      - .github/workflows/ghoststream-primary-reproduction.yml

permissions:
  contents: write

concurrency:
  group: ghoststream-primary-gmn-reproduction
  cancel-in-progress: false

jobs:
  reproduce-primary-gmn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile reconstruction
        run: |
          python -m py_compile pilots/ghoststream/reconstruction/reproduce_primary_gmn.py

      - name: Run frozen primary reproduction
        id: reproduce
        shell: bash
        run: |
          set +e
          python pilots/ghoststream/reconstruction/reproduce_primary_gmn.py \
            2>&1 | tee ghoststream_primary_reproduction.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > ghoststream_primary_reproduction_exit_code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Validate generated evidence
        if: always()
        run: |
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/primary_gmn_reproduction.json
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/PRIMARY_GMN_REPRODUCTION.md
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/reproduced_members_2019_2026.csv
          test -s pilots/ghoststream/reconstruction/primary_gmn_reproduction/reproduced_activity_tables.csv
          python -m json.tool \
            pilots/ghoststream/reconstruction/primary_gmn_reproduction/primary_gmn_reproduction.json \
            >/dev/null
          cat pilots/ghoststream/reconstruction/primary_gmn_reproduction/PRIMARY_GMN_REPRODUCTION.md

      - name: Upload complete reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-primary-gmn-reproduction
          path: |
            pilots/ghoststream/reconstruction/primary_gmn_reproduction/
            ghoststream_primary_reproduction.log
            ghoststream_primary_reproduction_exit_code.txt
          if-no-files-found: error
          retention-days: 90

      - name: Commit reproduction outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d pilots/ghoststream/reconstruction/primary_gmn_reproduction
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/reconstruction/primary_gmn_reproduction
          if git diff --cached --quiet; then
            echo "No reproduction output changes to commit."
          else
            git commit -m "Record frozen GhostStream primary reproduction"
            git push origin HEAD:agent/ghoststream-pilot
          fi

      - name: Preserve fail-closed workflow status
        if: always()
        shell: bash
        run: |
          status="${{ steps.reproduce.outputs.exit_code }}"
          if [[ -z "$status" ]]; then
            echo "Reproduction did not report an exit code."
            exit 1
          fi
          exit "$status"
