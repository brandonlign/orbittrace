name: GhostStream 2026 template ambiguity audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pilots/ghoststream/reconstruction/audit_2026_frozen_template.py"
      - "pilots/ghoststream/reconstruction/reproduce_primary_gmn_monthly.py"
      - "pilots/ghoststream/reconstruction/requirements-monthly.txt"
      - "pilots/ghoststream/april_stream/mdc/GhostStream_April_95_GMN_lookup.csv"
      - ".github/workflows/ghoststream-template-ambiguity-audit.yml"

permissions:
  contents: read

jobs:
  audit-template-ambiguity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install frozen reconstruction environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pilots/ghoststream/reconstruction/requirements-monthly.txt
          python -m pip freeze | sort | tee ghoststream_template_audit_environment.txt

      - name: Compile audit
        run: |
          python -m py_compile \
            pilots/ghoststream/reconstruction/reproduce_primary_gmn_monthly.py \
            pilots/ghoststream/reconstruction/audit_2026_frozen_template.py

      - name: Run complete ambiguity grid
        run: |
          python pilots/ghoststream/reconstruction/audit_2026_frozen_template.py \
            2>&1 | tee ghoststream_template_ambiguity_audit.log

      - name: Validate evidence
        run: |
          test -s pilots/ghoststream/reconstruction/template_ambiguity_audit/template_ambiguity_audit.json
          test -s pilots/ghoststream/reconstruction/template_ambiguity_audit/TEMPLATE_AMBIGUITY_AUDIT.md
          test -s pilots/ghoststream/reconstruction/template_ambiguity_audit/ranked_grid_summary.csv
          test -s pilots/ghoststream/reconstruction/template_ambiguity_audit/selected_event_grid.csv
          python -m json.tool \
            pilots/ghoststream/reconstruction/template_ambiguity_audit/template_ambiguity_audit.json \
            >/dev/null
          cat pilots/ghoststream/reconstruction/template_ambiguity_audit/TEMPLATE_AMBIGUITY_AUDIT.md

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-2026-template-ambiguity-audit
          path: |
            pilots/ghoststream/reconstruction/template_ambiguity_audit/
            ghoststream_template_audit_environment.txt
            ghoststream_template_ambiguity_audit.log
          if-no-files-found: error
          retention-days: 90
