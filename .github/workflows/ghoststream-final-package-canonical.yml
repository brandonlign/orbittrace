name: GhostStream canonical final package

on:
  push:
    branches:
      - agent/ghoststream-pilot
    paths:
      - ".github/workflows/ghoststream-final-package-canonical.yml"
  pull_request:
    paths:
      - ".github/workflows/ghoststream-final-package-canonical.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonical-final-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out GhostStream branch
        uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.2.3

      - name: Compile final package tools
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            pilots/ghoststream/reconstruction/finalize_recovery_metadata.py \
            pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py \
            pilots/ghoststream/april_stream/mdc/audit_recovered_mdc_package.py \
            pilots/ghoststream/april_stream/build_expert_review_bundle.py

      - name: Finalize canonical recovery metadata
        shell: bash
        run: |
          set -euo pipefail
          python pilots/ghoststream/reconstruction/finalize_recovery_metadata.py \
            2>&1 | tee ghoststream_finalize_metadata.log

      - name: Run recovered MDC package audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ghoststream_final_package_audit
          python pilots/ghoststream/april_stream/mdc/audit_recovered_mdc_package.py \
            --output-dir ghoststream_final_package_audit \
            2>&1 | tee ghoststream_final_package_audit.log
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("ghoststream_final_package_audit/mdc_package_consistency_audit.json").read_text())
          assert result["verdict"] == "PASS_RECOVERED_MDC_PACKAGE_INTERNALLY_CONSISTENT"
          assert result["check_count"] == 133
          assert result["passed_checks"] == 133
          assert result["failed_checks"] == 0
          assert result["recovered_analysis"]["discovery_lineage_reproduced"] is True
          assert result["recovered_analysis"]["submission_allowed"] is False
          print(json.dumps({
              "verdict": result["verdict"],
              "check_count": result["check_count"],
              "passed_checks": result["passed_checks"],
              "failed_checks": result["failed_checks"],
          }, indent=2))
          PY

      - name: Install and commit canonical outputs
        id: canonical
        shell: bash
        run: |
          set -euo pipefail
          cp ghoststream_final_package_audit/mdc_package_consistency_audit.json \
            pilots/ghoststream/april_stream/mdc/mdc_package_consistency_summary.json
          cp ghoststream_final_package_audit/MDC_PACKAGE_CONSISTENCY_AUDIT.md \
            pilots/ghoststream/april_stream/mdc/MDC_PACKAGE_CONSISTENCY_AUDIT.md
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pilots/ghoststream/results/ghoststream_final_summary.json \
            pilots/ghoststream/april_stream/candidate_solution.json \
            pilots/ghoststream/april_stream/mdc/mdc_package_consistency_summary.json \
            pilots/ghoststream/april_stream/mdc/MDC_PACKAGE_CONSISTENCY_AUDIT.md
          if git diff --cached --quiet; then
            echo "Canonical outputs already match."
          else
            git commit -m "Finalize GhostStream canonical package outputs"
            git pull --rebase origin agent/ghoststream-pilot
            git push origin HEAD:agent/ghoststream-pilot
          fi
          canonical_sha=$(git rev-parse HEAD)
          echo "$canonical_sha" | tee ghoststream_canonical_source_sha.txt
          echo "source_sha=$canonical_sha" >> "$GITHUB_OUTPUT"

      - name: Revalidate committed canonical state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.canonical.outputs.source_sha }}"
          python pilots/ghoststream/reconstruction/finalize_recovery_metadata.py \
            2>&1 | tee ghoststream_committed_finalize_metadata.log
          rm -rf ghoststream_committed_package_audit
          python pilots/ghoststream/april_stream/mdc/audit_recovered_mdc_package.py \
            --output-dir ghoststream_committed_package_audit \
            2>&1 | tee ghoststream_committed_package_audit.log
          cmp \
            ghoststream_committed_package_audit/mdc_package_consistency_audit.json \
            pilots/ghoststream/april_stream/mdc/mdc_package_consistency_summary.json
          cmp \
            ghoststream_committed_package_audit/MDC_PACKAGE_CONSISTENCY_AUDIT.md \
            pilots/ghoststream/april_stream/mdc/MDC_PACKAGE_CONSISTENCY_AUDIT.md
          test -z "$(git status --short -- \
            pilots/ghoststream/results/ghoststream_final_summary.json \
            pilots/ghoststream/april_stream/candidate_solution.json \
            pilots/ghoststream/april_stream/mdc/mdc_package_consistency_summary.json \
            pilots/ghoststream/april_stream/mdc/MDC_PACKAGE_CONSISTENCY_AUDIT.md)"

      - name: Build final deterministic expert-review bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ghoststream_final_expert_bundle
          python pilots/ghoststream/april_stream/build_expert_review_bundle.py \
            --output-dir ghoststream_final_expert_bundle \
            --commit-sha "${{ steps.canonical.outputs.source_sha }}" \
            2>&1 | tee ghoststream_final_expert_bundle.log

      - name: Validate final expert-review bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          source_sha = Path("ghoststream_canonical_source_sha.txt").read_text().strip()
          build = json.loads(Path("ghoststream_final_expert_bundle/expert_review_bundle_build.json").read_text())
          assert build["verdict"] == "PASS_CODE_INCLUSIVE_EXPERT_REVIEW_BUNDLE_BUILT"
          assert build["source_commit"] == source_sha
          assert build["included_files"] >= 110
          assert build["zip_members"] == build["included_files"] + 2
          zip_path = Path(build["output"])
          with zipfile.ZipFile(zip_path) as archive:
              assert archive.testzip() is None
              manifest = json.loads(archive.read("MANIFEST.json"))
              assert manifest["source_commit"] == source_sha
              assert manifest["reproducibility_status"] == "source_recovered_primary_internal_external_method_and_blind_evidence_complete"
              Path("ghoststream_final_expert_bundle/expert_bundle_manifest.json").write_bytes(
                  archive.read("MANIFEST.json")
              )
          audit = json.loads(Path("ghoststream_committed_package_audit/mdc_package_consistency_audit.json").read_text())
          final_gate = {
              "status": "PASS_GHOSTSTREAM_FINAL_PACKAGE_GATES",
              "artifact_name": "ghoststream-canonical-final-package",
              "source_commit": source_sha,
              "package_audit_verdict": audit["verdict"],
              "package_audit_checks": audit["check_count"],
              "package_audit_passes": audit["passed_checks"],
              "package_audit_failures": audit["failed_checks"],
              "expert_bundle_verdict": build["verdict"],
              "expert_bundle_files": build["included_files"],
              "expert_bundle_zip_sha256": build["zip_sha256"],
              "publication_or_formal_submission_allowed": False,
          }
          Path("ghoststream_final_expert_bundle/final_gate_summary.json").write_text(
              json.dumps(final_gate, indent=2) + "\n"
          )
          print(json.dumps(final_gate, indent=2))
          PY

      - name: Upload stable final package
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-canonical-final-package
          path: |
            ghoststream_final_expert_bundle/
            ghoststream_committed_package_audit/
            ghoststream_canonical_source_sha.txt
            ghoststream_finalize_metadata.log
            ghoststream_committed_finalize_metadata.log
            ghoststream_final_package_audit.log
            ghoststream_committed_package_audit.log
            ghoststream_final_expert_bundle.log
          if-no-files-found: error
          retention-days: 90
