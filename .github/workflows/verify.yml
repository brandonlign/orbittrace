name: Verify GhostStream repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify frozen repository state
        run: python scripts/verify_repository.py

  paper-robustness:
    if: github.event_name == 'pull_request' && github.head_ref == 'paper-robustness-20260822'
    name: paper robustness shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'hdbscan==0.8.33' 'scipy<1.12'
      - name: Run frozen shard
        env:
          PYTHONHASHSEED: '0'
        run: |
          python validation/paper_core_robustness/run_hyperparameter_sensitivity.py \
            --out validation/paper_core_robustness/shard-${{ matrix.shard }} \
            --shard-index ${{ matrix.shard }} --shard-count 4
      - uses: actions/upload-artifact@v4
        with:
          name: paper-robustness-shard-${{ matrix.shard }}
          path: validation/paper_core_robustness/shard-${{ matrix.shard }}
          if-no-files-found: error

  paper-robustness-aggregate:
    if: github.event_name == 'pull_request' && github.head_ref == 'paper-robustness-20260822'
    name: aggregate paper robustness
    needs: paper-robustness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'hdbscan==0.8.33' 'scipy<1.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: paper-robustness-shard-*
          path: validation/paper_core_robustness/downloaded
      - name: Aggregate and assert baseline
        run: |
          python validation/paper_core_robustness/run_hyperparameter_sensitivity.py \
            --out validation/paper_core_robustness/results \
            --aggregate validation/paper_core_robustness/downloaded
      - uses: actions/upload-artifact@v4
        with:
          name: paper-core-robustness-results
          path: validation/paper_core_robustness/results
          if-no-files-found: error
