name: GhostStream linked EDMOND v6.01 frozen evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-linked-edmond:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile frozen evaluator
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/evaluate_linked_v601_archives.py

      - name: Evaluate all usable linked annual ZIPs
        shell: bash
        run: |
          cd pilots/ghoststream/april_stream/edmond_2024
          python evaluate_linked_v601_archives.py \
            --output-dir "$GITHUB_WORKSPACE/edmond_linked_evaluation" \
            --workers 4 \
            2>&1 | tee "$GITHUB_WORKSPACE/edmond_linked_evaluation.log"

      - name: Display frozen-test verdict
        if: always()
        run: |
          test -f edmond_linked_evaluation/linked_v601_frozen_evaluation.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("edmond_linked_evaluation/linked_v601_frozen_evaluation.json").read_text())
          activity = result["frozen_activity_test"]
          orbit = result["post_selection_orbit_check"]
          overlap = result["overlap_audit"]
          print(json.dumps({
              "verdict": result["verdict"],
              "validated_years": result["archive_acquisition"]["years_validated"],
              "unavailable_or_invalid": result["archive_acquisition"]["years_unavailable_or_invalid"],
              "selected_members": activity["selected_members"],
              "activity_p": activity["one_sided_fisher_p"],
              "activity_odds_ratio": activity["odds_ratio_haldane_anscombe"],
              "shifted_window_p": result["shifted_window_audit"].get("empirical_p_plus_one"),
              "orbit_null_p": orbit.get("p_plus_one"),
              "prior_Shober_overlaps": overlap["exact_UTC_overlaps_with_six_Shober_EDMOND_members"],
              "additional_selected_events": overlap["selected_events_not_in_prior_six_member_table"],
          }, indent=2))
          PY

      - name: Upload frozen evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-linked-edmond-v601-frozen-evaluation
          path: |
            edmond_linked_evaluation/
            edmond_linked_evaluation.log
          if-no-files-found: error
          retention-days: 30
