name: GhostStream reconcile EDMOND release integrity

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-edmond-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile guarded reconciliation
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/reconcile_linked_release_integrity.py

      - name: Reconcile scientific claims
        run: |
          python pilots/ghoststream/april_stream/edmond_2024/reconcile_linked_release_integrity.py

      - name: Validate reconciled outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool pilots/ghoststream/april_stream/candidate_solution.json >/dev/null
          python -m json.tool pilots/ghoststream/results/ghoststream_final_summary.json >/dev/null
          python -m json.tool pilots/ghoststream/april_stream/edmond_2024/linked_v601_frozen_summary.json >/dev/null
          grep -F "not the complete advertised v6.01 release" pilots/ghoststream/RESULTS.md
          grep -F "not represented as a complete v6.01 replication" pilots/ghoststream/april_stream/mdc/MANUSCRIPT_DRAFT.md
          grep -F "Currently linked EDMOND annual-file audit" pilots/ghoststream/april_stream/ALL_EXTERNAL_ZERO_SPEED.md
          grep -F "SUPERSEDED_BY_EDMOND_CURRENT_RELEASE_AUDIT" pilots/ghoststream/april_stream/edmond_2024/LINKED_V601_FROZEN_VALIDATION.md
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = json.loads(Path("pilots/ghoststream/april_stream/candidate_solution.json").read_text())
          evidence = candidate["independent_archive_evidence"]
          assert "full_linked_edmond_v601" not in evidence
          linked = evidence["currently_linked_edmond_annual_files"]
          assert linked["complete_advertised_release_tested"] is False
          assert linked["currently_linked_rows_2001_2023"] == 481252
          assert linked["advertised_rows_2001_2023"] == 614758
          assert linked["annual_row_count_matches"] == 0
          assert linked["selected_members"] == 6
          assert linked["additional_selected_events"] == 0

          summary = json.loads(Path("pilots/ghoststream/results/ghoststream_final_summary.json").read_text())
          edmond = summary["supporting_edmond_evidence"]
          assert edmond["complete_advertised_release_tested"] is False
          assert "full_linked_annual_archives_validated" not in edmond
          assert edmond["currently_linked_annual_files_validated"] == 23

          linked_summary = json.loads(Path("pilots/ghoststream/april_stream/edmond_2024/linked_v601_frozen_summary.json").read_text())
          assert linked_summary["release_integrity"]["complete_advertised_release_tested"] is False
          print("EDMOND integrity reconciliation validated.")
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pilots/ghoststream/RESULTS.md \
            pilots/ghoststream/april_stream/ALL_EXTERNAL_ZERO_SPEED.md \
            pilots/ghoststream/april_stream/candidate_solution.json \
            pilots/ghoststream/april_stream/mdc/MANUSCRIPT_DRAFT.md \
            pilots/ghoststream/april_stream/shober_edmond/SHOBER_EDMOND_VALIDATION.md \
            pilots/ghoststream/results/ghoststream_final_summary.json \
            pilots/ghoststream/april_stream/edmond_2024/LINKED_V601_FROZEN_VALIDATION.md \
            pilots/ghoststream/april_stream/edmond_2024/linked_v601_frozen_summary.json
          if git diff --cached --quiet; then
            echo "No reconciliation changes remain to commit."
          else
            git commit -m "Reconcile EDMOND linked-release integrity"
            git push origin HEAD:agent/ghoststream-pilot
          fi
