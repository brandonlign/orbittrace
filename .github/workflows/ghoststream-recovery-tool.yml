name: GhostStream local recovery tool

on:
  pull_request:
    paths:
      - "pilots/ghoststream/recovery/**"
      - ".github/workflows/ghoststream-recovery-tool.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-recovery-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile recovery tool
        run: |
          python -m py_compile pilots/ghoststream/recovery/audit_local_workspace.py

      - name: Build isolated recovery fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/project fixture/search/OpenCode fixture/home
          git -C fixture/project init
          git -C fixture/project config user.name fixture
          git -C fixture/project config user.email fixture@example.invalid
          cat > fixture/project/README.md <<'EOF'
          fixture
          EOF
          git -C fixture/project add README.md
          git -C fixture/project commit -m initial

          cat > fixture/project/ghoststream_bootstrap.py <<'PY'
          # source-preserving antihelion year/night bootstrap fixture
          print("fixture")
          PY
          cat > fixture/search/OpenCode/session-export.json <<'EOF'
          {"project":"GhostStream", "analysis":"geographic split and specification curve"}
          EOF
          printf 'archive fixture' > fixture/search/ghoststream-analysis.zip
          cat > fixture/home/.zsh_history <<'EOF'
          python ghoststream_bootstrap.py --antihelion
          export API_KEY=must_not_appear
          EOF
          touch -t 202607301200 fixture/project/ghoststream_bootstrap.py
          touch -t 202607301201 fixture/search/OpenCode/session-export.json
          touch -t 202607301202 fixture/search/ghoststream-analysis.zip

      - name: Run read-only fixture audit
        shell: bash
        env:
          HOME: ${{ github.workspace }}/fixture/home
        run: |
          set -euo pipefail
          before=$(git -C fixture/project status --porcelain=v1 --untracked-files=all | sha256sum)
          python pilots/ghoststream/recovery/audit_local_workspace.py \
            --repo "$GITHUB_WORKSPACE/fixture/project" \
            --root "$GITHUB_WORKSPACE/fixture/search" \
            --output-dir "$GITHUB_WORKSPACE/recovery_output" \
            --start 2026-07-20T00:00:00+00:00 \
            --end 2026-08-05T00:00:00+00:00 2>&1 | tee recovery_tool.log
          after=$(git -C fixture/project status --porcelain=v1 --untracked-files=all | sha256sum)
          test "$before" = "$after"

      - name: Validate recovery report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("recovery_output")
          report = json.loads((root / "ghoststream_local_recovery_audit.json").read_text())
          paths = {item["path"]: item for item in report["file_hits"]}
          source = [item for item in paths.values() if item["path"].endswith("ghoststream_bootstrap.py")]
          session = [item for item in paths.values() if item["path"].endswith("session-export.json")]
          archives = [item for item in paths.values() if item["path"].endswith("ghoststream-analysis.zip")]
          assert len(source) == 1
          assert "antihelion" in source[0]["content_terms"]
          assert len(session) == 1
          assert "ghoststream" in session[0]["content_terms"]
          assert len(archives) == 1
          assert report["privacy"]["network_used"] is False
          assert report["privacy"]["files_modified"] is False
          assert report["privacy"]["files_copied"] is False
          history = report["history_results"]
          assert history and history[0]["match_count"] >= 1
          assert all("must_not_appear" not in match["text"] for item in history for match in item["matches"])
          assert (root / "GHOSTSTREAM_LOCAL_RECOVERY_AUDIT.md").is_file()
          assert (root / "git_results.json").is_file()
          print(json.dumps({
              "file_candidates": len(paths),
              "source_hits": len(source),
              "session_hits": len(session),
              "archive_hits": len(archives),
          }, indent=2))
          PY

      - name: Upload fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-recovery-tool-test
          path: |
            recovery_output/
            recovery_tool.log
          if-no-files-found: error
          retention-days: 14

  preserve-original-runner-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out GhostStream branch
        uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - name: Check out recovery-gate snapshot
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-worker
          ref: 4175e5187fcc6faf3d1befb099a9e35be96850f2
          path: _ghoststream_source/pr56

      - name: Check out novel-search snapshot
        uses: actions/checkout@v4
        with:
          repository: brandonlign/remotion-worker
          ref: 39972b5fe0cf4d47092d3caa2b3ced12bedb065e
          path: _ghoststream_source/pr57

      - name: Preserve exact trees and manifest
        shell: bash
        run: |
          set -euo pipefail
          target="pilots/ghoststream/recovered_pipeline"
          rm -rf "$target"
          mkdir -p "$target/pr56_runner" "$target/pr57_novel"
          cp -a _ghoststream_source/pr56/ghoststream_runner/. "$target/pr56_runner/"
          cp -a _ghoststream_source/pr57/ghoststream_novel/. "$target/pr57_novel/"

          test "$(find "$target/pr56_runner" -type f | wc -l | tr -d ' ')" -eq 14
          test "$(find "$target/pr57_novel" -type f | wc -l | tr -d ' ')" -eq 35
          test -f "$target/pr56_runner/validate_candidates.py"
          test -f "$target/pr56_runner/multiyear_confirmation.py"
          test -f "$target/pr57_novel/run_novel_search_fixed.py"
          test -f "$target/pr57_novel/validate_april_candidate.py"
          test -f "$target/pr57_novel/validate_april_source_null.py"
          test -f "$target/pr57_novel/bootstrap_april_solution.py"
          test -f "$target/pr57_novel/specification_curve_april.py"
          test -f "$target/pr57_novel/flux_handoff/make_ghoststream_flux_catalog.py"

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("pilots/ghoststream/recovered_pipeline")
          sources = {
              "pr56_runner": {
                  "repository": "brandonlign/remotion-worker",
                  "pull_request": 56,
                  "source_path": "ghoststream_runner",
                  "commit": "4175e5187fcc6faf3d1befb099a9e35be96850f2",
              },
              "pr57_novel": {
                  "repository": "brandonlign/remotion-worker",
                  "pull_request": 57,
                  "source_path": "ghoststream_novel",
                  "commit": "39972b5fe0cf4d47092d3caa2b3ced12bedb065e",
              },
          }
          for name, metadata in sources.items():
              directory = root / name
              files = []
              for path in sorted(p for p in directory.rglob("*") if p.is_file()):
                  payload = path.read_bytes()
                  files.append({
                      "path": path.relative_to(directory).as_posix(),
                      "bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  })
              metadata["file_count"] = len(files)
              metadata["files"] = files
          manifest = {
              "status": "RECOVERED_FROM_IMMUTABLE_GITHUB_PR_COMMITS",
              "destination_branch": "agent/ghoststream-pilot",
              "sources": sources,
              "preservation_note": (
                  "Exact snapshots of the temporary GitHub Actions runner trees that generated "
                  "the GhostStream discovery, validation, and downstream audit outputs."
              ),
          }
          (root / "SOURCE_MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (root / "README.md").write_text(
              "# Recovered GhostStream source pipeline\n\n"
              "This directory preserves exact snapshots of the executable GhostStream source trees "
              "from remotion-worker PR #56 and PR #57 at immutable commit SHAs. "
              "See `SOURCE_MANIFEST.json` for file-level SHA-256 provenance.\n\n"
              "These snapshots must remain unchanged. Reproduction repairs belong in a separate tree.\n"
          )
          PY

          python -m compileall -q "$target"
          git diff --check

      - name: Commit recovered snapshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/recovered_pipeline
          if git diff --cached --quiet; then
            echo "Recovered source snapshots already preserved."
          else
            git commit -m "Recover GhostStream runner source code"
            git push origin HEAD:agent/ghoststream-pilot
          fi
