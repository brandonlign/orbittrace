name: GhostStream integrate linked EDMOND result

on:
  pull_request:
    paths:
      - "pilots/ghoststream/april_stream/edmond_2024/apply_linked_v601_result_updates.py"
      - ".github/workflows/ghoststream-apply-edmond-results.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-edmond-result:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile guarded updater
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/apply_linked_v601_result_updates.py

      - name: Apply completed scientific result
        run: |
          python pilots/ghoststream/april_stream/edmond_2024/apply_linked_v601_result_updates.py

      - name: Validate updated outputs
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool pilots/ghoststream/april_stream/candidate_solution.json >/dev/null
          python -m json.tool pilots/ghoststream/results/ghoststream_final_summary.json >/dev/null
          grep -F "Full linked EDMOND v6.01 annual audit" pilots/ghoststream/april_stream/ALL_EXTERNAL_ZERO_SPEED.md
          grep -F "Full linked EDMOND v6.01 audit" pilots/ghoststream/april_stream/mdc/MANUSCRIPT_DRAFT.md
          grep -F "23 usable linked annual archives" pilots/ghoststream/RESULTS.md
          python - <<'PY'
          import json
          from pathlib import Path
          candidate = json.loads(Path("pilots/ghoststream/april_stream/candidate_solution.json").read_text())
          full = candidate["independent_archive_evidence"]["full_linked_edmond_v601"]
          assert full["validated_annual_archives"] == 23
          assert full["selected_members"] == 6
          assert full["additional_selected_events"] == 0
          assert full["standalone_gate_passed"] is False
          summary = json.loads(Path("pilots/ghoststream/results/ghoststream_final_summary.json").read_text())
          assert summary["primary_result"]["internal_id"] == "GhostStream-April-36.9"
          assert summary["secondary_result"]["iau_code"] == "NMV"
          print("Updated canonical outputs validated.")
          PY

      - name: Commit integrated result
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pilots/ghoststream/RESULTS.md \
            pilots/ghoststream/april_stream/ALL_EXTERNAL_ZERO_SPEED.md \
            pilots/ghoststream/april_stream/candidate_solution.json \
            pilots/ghoststream/april_stream/mdc/MANUSCRIPT_DRAFT.md \
            pilots/ghoststream/april_stream/shober_edmond/SHOBER_EDMOND_VALIDATION.md \
            pilots/ghoststream/results/ghoststream_final_summary.json
          if git diff --cached --quiet; then
            echo "No integration changes remain to commit."
          else
            git commit -m "Integrate full linked EDMOND validation"
            git push origin HEAD:agent/ghoststream-pilot
          fi
