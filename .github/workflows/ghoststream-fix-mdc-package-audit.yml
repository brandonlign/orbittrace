name: GhostStream fix MDC package audit

on:
  pull_request:
    paths:
      - ".github/workflows/ghoststream-fix-mdc-package-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-package-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - name: Apply syntax-aware source fix
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path("pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py")
          lines = audit.read_text().splitlines()
          target = 'for key in ("q", "e", "peri", "node", "incl", "a"):'
          matches = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(matches) != 1:
              raise SystemExit(f"audit mapping line matches={matches}")
          i = matches[0]
          indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
          if i + 1 >= len(lines) or 'calculation audit -> mean JSON' not in lines[i + 1]:
              raise SystemExit("unexpected audit mapping body")
          lines[i] = indent + 'for calc_key, mean_key in (("q", "q"), ("e", "e"), ("peri", "peri"), ("node", "node"), ("incl", "inc"), ("a", "a")):'
          lines[i + 1] = indent + '    close(f"calculation audit -> mean JSON {calc_key}", calc_means[calc_key], mean[mean_key], 5e-6)'
          audit.write_text("\n".join(lines) + "\n")
          PY

      - name: Validate source fix
        run: |
          python -m py_compile pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          grep -F '("incl", "inc")' pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          git commit -m "Fix MDC package audit field mapping"
          git push origin HEAD:agent/ghoststream-pilot
