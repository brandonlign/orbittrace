name: GhostStream live IAU MDC novelty refresh

on:
  pull_request:
    paths:
      - "pilots/ghoststream/april_stream/mdc/refresh_live_mdc_novelty.py"
      - ".github/workflows/ghoststream-live-mdc-novelty.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-live-mdc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile frozen novelty refresh
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/mdc/refresh_live_mdc_novelty.py

      - name: Download and audit live IAU MDC catalogue
        run: |
          python pilots/ghoststream/april_stream/mdc/refresh_live_mdc_novelty.py \
            --output-dir live_mdc_refresh 2>&1 | tee live_mdc_refresh.log

      - name: Validate output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("live_mdc_refresh/live_mdc_novelty_refresh.json")
          result = json.loads(p.read_text())
          assert result["catalogue"]["parsed_solutions"] > 0
          assert len(result["catalogue"]["sha256"]) == 64
          assert result["hard_duplicate_match_count"] == len(result["hard_duplicate_matches"])
          print(json.dumps({
              "verdict": result["verdict"],
              "catalogue": result["catalogue"],
              "hard_duplicate_match_count": result["hard_duplicate_match_count"],
              "radiant_speed_activity_match_count": result["radiant_speed_activity_match_count"],
              "orbit_incomplete_near_match_count": result["orbit_incomplete_near_match_count"],
              "nearest_complete_orbit": result["nearest_complete_orbits"][0] if result["nearest_complete_orbits"] else None,
          }, indent=2))
          PY

      - name: Upload novelty-refresh evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-live-mdc-novelty-refresh
          path: |
            live_mdc_refresh/
            live_mdc_refresh.log
          if-no-files-found: error
          retention-days: 30
