name: GhostStream EDMOND recovery fast path

on:
  pull_request:
    paths:
      - "pilots/ghoststream/april_stream/edmond_2024/**"
      - ".github/workflows/ghoststream-edmond-recovery-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-current-edmond-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile recovery tools
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/recover_current_edmond.py \
            pilots/ghoststream/april_stream/edmond_2024/recover_current_edmond_fast.py

      - name: Run parallel recovery
        shell: bash
        run: |
          set +e
          cd pilots/ghoststream/april_stream/edmond_2024
          python recover_current_edmond_fast.py \
            --output-dir "$GITHUB_WORKSPACE/edmond_fast_audit" \
            2>&1 | tee "$GITHUB_WORKSPACE/edmond_fast_audit.log"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$GITHUB_WORKSPACE/edmond_fast_audit"
          printf '%s\n' "$status" > "$GITHUB_WORKSPACE/edmond_fast_audit/exit_code.txt"
          if [[ "$status" != "0" && "$status" != "3" ]]; then
            exit "$status"
          fi

      - name: Display verdict
        if: always()
        run: |
          test -f edmond_fast_audit/current_edmond_recovery_fast.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("edmond_fast_audit/current_edmond_recovery_fast.json").read_text())
          print(json.dumps({
              "verdict": result["verdict"],
              "accepted_archive_url": result.get("accepted_archive_url"),
              "probe_count": len(result.get("probes", [])),
              "reference_2023": result.get("reference_2023_probe", {}).get("outcome"),
          }, indent=2))
          PY

      - name: Upload fast-path evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-edmond-2024-recovery-fast
          path: |
            edmond_fast_audit/
            edmond_fast_audit.log
          if-no-files-found: error
          retention-days: 30
