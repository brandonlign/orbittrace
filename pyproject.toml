[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconnectid-pilot"
version = "0.1.0"
description = "Reproducible feasibility pilot for invariant localization of MMS EDR events"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.12,<2", "pandas>=2.2,<4",
  "scikit-learn>=1.4,<2", "matplotlib>=3.8,<4", "pyspedas>=1.6,<3",
  "pytplot>=1.7,<3", "cdflib>=1.3,<2", "requests>=2.31,<3",
  "pyyaml>=6,<7", "joblib>=1.3,<2", "pyarrow>=15,<22",
  "bokeh>=2.4,<3", "astropy>=6,<8", "pytz>=2024"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reconnectid = "reconnectid.run_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
