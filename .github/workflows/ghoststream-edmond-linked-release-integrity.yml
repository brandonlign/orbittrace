name: GhostStream EDMOND linked-release integrity

on:
  pull_request:
    paths:
      - "pilots/ghoststream/april_stream/edmond_2024/audit_linked_release_integrity.py"
      - ".github/workflows/ghoststream-edmond-linked-release-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-linked-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile integrity audit
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/audit_linked_release_integrity.py

      - name: Inspect linked annual archives
        shell: bash
        run: |
          cd pilots/ghoststream/april_stream/edmond_2024
          python audit_linked_release_integrity.py \
            --output-dir "$GITHUB_WORKSPACE/edmond_release_integrity" \
            --workers 6 \
            2>&1 | tee "$GITHUB_WORKSPACE/edmond_release_integrity.log"

      - name: Display integrity verdict
        if: always()
        run: |
          test -f edmond_release_integrity/linked_release_integrity.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("edmond_release_integrity/linked_release_integrity.json").read_text())
          print(json.dumps({
              "verdict": result["verdict"],
              "actual_rows": result["actual_rows_in_validated_linked_ZIPs"],
              "advertised_rows_for_same_years": result["advertised_rows_for_same_validated_years"],
              "coverage_fraction": result["coverage_fraction_for_same_years"],
              "version_counts": result["all_version_counts"],
              "exact_count_years": result["exact_count_years"],
              "mismatched_year_count": len(result["mismatched_years"]),
              "unavailable_or_invalid": result["unavailable_or_invalid"],
          }, indent=2))
          PY

      - name: Upload integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-edmond-linked-release-integrity
          path: |
            edmond_release_integrity/
            edmond_release_integrity.log
          if-no-files-found: error
          retention-days: 30
