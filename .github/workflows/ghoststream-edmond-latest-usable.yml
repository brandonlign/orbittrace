name: GhostStream latest usable EDMOND validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-latest-usable-edmond:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile frozen validation
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/edmond_2024/analyze_latest_usable_edmond.py

      - name: Apply frozen template to live 2022 and 2023 annual files
        run: |
          python pilots/ghoststream/april_stream/edmond_2024/analyze_latest_usable_edmond.py \
            --output-dir latest_usable_edmond 2>&1 | tee latest_usable_edmond.log

      - name: Display verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("latest_usable_edmond/latest_usable_edmond_frozen_validation.json")
          result = json.loads(p.read_text())
          print(json.dumps({
              "verdict": result["verdict"],
              "2022": result["year_summaries"]["2022"],
              "2023": result["year_summaries"]["2023"],
              "pooled": result["pooled_summary"],
          }, indent=2))
          PY

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-latest-usable-edmond-validation
          path: |
            latest_usable_edmond/
            latest_usable_edmond.log
          if-no-files-found: error
          retention-days: 30
