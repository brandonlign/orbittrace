name: GhostStream fix MDC package audit

on:
  pull_request:
    paths:
      - ".github/workflows/ghoststream-fix-mdc-package-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-package-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - name: Apply structural package-audit fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          audit = Path("pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py")
          lines = audit.read_text().splitlines()

          # Existing field aliases must remain explicit.
          for i, line in enumerate(lines):
              if '"inc": "incl"' in line:
                  lines[i] = line.replace('"inc": "incl"', '"inc": "inc"')
          if not any('for calc_key, mean_key in (("q", "q")' in line for line in lines):
              raise SystemExit("calculation-to-submission field mapping is missing")
          if not any('mean_key = "inc" if key == "incl" else key' in line for line in lines):
              raise SystemExit("legacy inclination field mapping is missing")
          if not any('"inc": "inc"' in line for line in lines):
              raise SystemExit("checker inclination field mapping is missing")

          # Replace the lookup-comparison section using stable neighboring statements.
          start_matches = [i for i, line in enumerate(lines) if line.strip().startswith('for key in ("LoSb", "LoSe", "LoS", "Ra", "De", "Vg", "LoR", "S_LoR", "LaR", "dRa", "dDe")')]
          end_matches = [i for i, line in enumerate(lines) if line.strip().startswith('check("lookup recomputation -> N"')]
          if len(start_matches) != 1 or len(end_matches) != 1 or not start_matches[0] < end_matches[0]:
              raise SystemExit(f"lookup section boundaries start={start_matches} end={end_matches}")
          start, end = start_matches[0], end_matches[0]
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          lookup_replacement = [
              indent + 'lookup_quantization_tolerance = {',
              indent + '    "LoSb": 5e-7,',
              indent + '    "LoSe": 5e-7,',
              indent + '    "LoS": 5e-7,',
              indent + '    "Ra": 5e-7,',
              indent + '    "De": 5e-7,',
              indent + '    "Vg": 5e-7,',
              indent + '    "LoR": 5e-7,',
              indent + '    "S_LoR": 5e-7,',
              indent + '    "LaR": 5e-7,',
              indent + '    "dRa": 1e-6,',
              indent + '    "dDe": 1e-6,',
              indent + '}',
              indent + 'for key in ("LoSb", "LoSe", "LoS", "Ra", "De", "Vg", "LoR", "S_LoR", "LaR", "dRa", "dDe"):',
              indent + '    tolerance = lookup_quantization_tolerance[key]',
              indent + '    close(',
              indent + '        f"lookup recomputation -> calculation audit {key}",',
              indent + '        recomputed[key],',
              indent + '        calc_means[key],',
              indent + '        tolerance,',
              indent + '        "The lookup serializes source columns to six decimals; this is a quantization bound, not a scientific threshold.",',
              indent + '    )',
              indent + '    close(f"lookup recomputation -> mean JSON {key}", recomputed[key], mean[key], 5e-6)',
          ]
          lines[start:end] = lookup_replacement

          # Locate the semimajor section after the lookup replacement and replace it up to legacy parsing.
          semimajor_starts = [i for i, line in enumerate(lines) if line.strip().startswith('for calc_key, mean_key in (("q", "q"), ("e", "e"), ("peri", "peri"), ("node", "node"), ("incl", "inc"), ("a", "a"))')]
          legacy_starts = [i for i, line in enumerate(lines) if line.strip() == 'legacy = parse_legacy(LEGACY)']
          if len(semimajor_starts) != 1 or len(legacy_starts) != 1 or not semimajor_starts[0] < legacy_starts[0]:
              raise SystemExit(f"semimajor section boundaries start={semimajor_starts} end={legacy_starts}")
          start, end = semimajor_starts[0], legacy_starts[0]
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          semimajor_replacement = [
              indent + 'for calc_key, mean_key in (("q", "q"), ("e", "e"), ("peri", "peri"), ("node", "node"), ("incl", "inc"), ("a", "a")):',
              indent + '    close(f"calculation audit -> mean JSON {calc_key}", calc_means[calc_key], mean[mean_key], 5e-6)',
              indent + 'semimajor = calc["semimajor_axis_derivation"]',
              indent + 'full_precision_derived_a = float(calc_means["q"]) / (1.0 - float(calc_means["e"]))',
              indent + 'close(',
              indent + '    "calculation audit full-precision semimajor identity q/(1-e)",',
              indent + '    float(semimajor["a_from_full_precision_means"]),',
              indent + '    full_precision_derived_a,',
              indent + '    5e-12,',
              indent + ')',
              indent + 'submitted_derived_a = float(mean["q"]) / (1.0 - float(mean["e"]))',
              indent + 'close(',
              indent + '    "calculation audit exact submitted semimajor derivation",',
              indent + '    float(semimajor["exact_a_from_submitted_q_e"]),',
              indent + '    submitted_derived_a,',
              indent + '    5e-12,',
              indent + ')',
              indent + 'close(',
              indent + '    "mean JSON semimajor identity at six-decimal precision",',
              indent + '    float(mean["a"]),',
              indent + '    submitted_derived_a,',
              indent + '    5e-7,',
              indent + '    "The submitted a is q/(1-e) rounded to six decimals from the submitted six-decimal q and e.",',
              indent + ')',
              indent + 'close(',
              indent + '    "calculation audit submitted semimajor value",',
              indent + '    float(calc_means["a"]),',
              indent + '    float(mean["a"]),',
              indent + '    5e-12,',
              indent + ')',
              '',
          ]
          lines[start:end] = semimajor_replacement

          text = "\n".join(lines) + "\n"
          required = [
              'lookup_quantization_tolerance = {',
              'calculation audit full-precision semimajor identity q/(1-e)',
              'calculation audit exact submitted semimajor derivation',
              'mean JSON semimajor identity at six-decimal precision',
              '"inc": "inc"',
          ]
          for token in required:
              if text.count(token) != 1:
                  raise SystemExit(f"required token count for {token!r}: {text.count(token)}")
          audit.write_text(text)
          PY

      - name: Validate source fixes
        run: |
          python -m py_compile pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          grep -F 'lookup_quantization_tolerance = {' pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          grep -F 'calculation audit full-precision semimajor identity q/(1-e)' pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          grep -F 'mean JSON semimajor identity at six-decimal precision' pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          git diff --check

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/april_stream/mdc/audit_mdc_package_consistency.py
          if git diff --cached --quiet; then
            echo "Package audit already models quantization and rounded semimajor derivation."
          else
            git commit -m "Model MDC package quantization and semimajor rounding"
            git push origin HEAD:agent/ghoststream-pilot
          fi
