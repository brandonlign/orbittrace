name: GhostStream primary reproduction PR check

on:
  pull_request:
    paths:
      - "pilots/ghoststream/reconstruction/RECONSTRUCTION_PROTOCOL.md"
      - "pilots/ghoststream/reconstruction/probe_gmn_monthly_source.py"
      - "pilots/ghoststream/april_stream/mdc/GhostStream_April_95_GMN_lookup.csv"
      - ".github/workflows/ghoststream-primary-reproduction-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-official-monthly-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned GMN parser environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "gmn-python-api==0.0.13"
          python -m pip freeze | sort | tee ghoststream_monthly_probe_environment.txt

      - name: Compile monthly-source probe
        run: |
          python -m py_compile pilots/ghoststream/reconstruction/probe_gmn_monthly_source.py

      - name: Probe official April 2019 catalogue
        run: |
          python pilots/ghoststream/reconstruction/probe_gmn_monthly_source.py \
            2>&1 | tee ghoststream_gmn_monthly_probe.log

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-gmn-monthly-source-probe
          path: |
            ghoststream_gmn_monthly_probe.log
            ghoststream_monthly_probe_environment.txt
          if-no-files-found: error
          retention-days: 90
