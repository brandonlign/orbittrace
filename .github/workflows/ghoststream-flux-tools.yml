name: GhostStream flux handoff tools

on:
  pull_request:
    paths:
      - "pilots/ghoststream/april_stream/flux/**"
      - ".github/workflows/ghoststream-flux-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-flux-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile tools
        run: |
          python -m py_compile \
            pilots/ghoststream/april_stream/flux/make_ghoststream_flux_catalog.py \
            pilots/ghoststream/april_stream/flux/preflight_level2_flux_data.py

      - name: Test custom flux catalogue generation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test_rms/share generated
          cat > test_rms/share/flux_showers.csv <<'EOF'
          # minimal official-table fixture
              6|LYR |April Lyrids                     |30|32.4|34|272.3|0.95|33.3|-0.32|46.6|0.29|annual|33.15|18|1.229|4.62|2.1|98.7|3.3|{}
          EOF

          for s in 1.7 1.8 1.9 2.0 2.1; do
            out="generated/s_${s}"
            python pilots/ghoststream/april_stream/flux/make_ghoststream_flux_catalog.py \
              --rms-root test_rms \
              --mass-index "$s" \
              --output-dir "$out"
            python - "$out" "$s" <<'PY'
          import json
          import math
          import pathlib
          import sys

          out = pathlib.Path(sys.argv[1])
          s = float(sys.argv[2])
          lines = [line for line in (out / "flux_showers_ghoststream.csv").read_text().splitlines()
                   if line and not line.startswith("#")]
          candidate = lines[-1].split("|")
          assert len(candidate) == 21, len(candidate)
          assert candidate[1].strip() == "GSA"
          assert abs(float(candidate[3]) - 35.902) < 1e-9
          assert abs(float(candidate[5]) - 39.902) < 1e-9
          metadata = json.loads((out / "ghoststream_flux_catalog_metadata.json").read_text())
          expected_r = 10 ** ((s - 1) / 2.5)
          assert abs(metadata["population_index"] - expected_r) < 1e-12
          assert abs(float(candidate[17]) - expected_r) < 1e-7
          PY
          done

      - name: Test Level 2 directory preflight
        shell: bash
        run: |
          set -euo pipefail
          root=fixtures

          raw="$root/US0001_20260427_000000"
          mkdir -p "$raw"
          touch "$raw/FTPdetectinfo_US0001.txt" "$raw/.config" \
                "$raw/platepar_cmn2010.cal" "$raw/mask.bmp" \
                "$raw/CALSTARS_US0001.txt" "$raw/FF_US0001_20260427.fits"

          metadata="$root/HR0001_20260428_000000"
          mkdir -p "$metadata"
          touch "$metadata/FTPdetectinfo_HR0001.txt" "$metadata/.config" \
                "$metadata/platepars_flux_recalibrated.json" "$metadata/mask.bmp" \
                "$metadata/flux_time_intervals.json" \
                "$metadata/flux_sensor_characterization.json" \
                "$metadata/collection_area_GSA.json"

          incomplete="$root/AU0001_20260429_000000"
          mkdir -p "$incomplete"
          touch "$incomplete/FTPdetectinfo_AU0001.txt"

          set +e
          python pilots/ghoststream/april_stream/flux/preflight_level2_flux_data.py \
            "$root" --output-dir preflight_output
          status=$?
          set -e
          test "$status" -eq 2

          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("preflight_output/level2_flux_preflight.json").read_text())
          assert result["night_directories_found"] == 3
          assert result["status_counts"] == {
              "READY_RAW_RECOMPUTE": 1,
              "READY_PRECOMPUTED_METADATA": 1,
              "INCOMPLETE": 1,
          }, result["status_counts"]
          audits = {Path(item["directory"]).name: item for item in result["audits"]}
          assert audits["US0001_20260427_000000"]["status"] == "READY_RAW_RECOMPUTE"
          assert audits["HR0001_20260428_000000"]["status"] == "READY_PRECOMPUTED_METADATA"
          assert audits["AU0001_20260429_000000"]["status"] == "INCOMPLETE"
          assert "station config" in audits["AU0001_20260429_000000"]["missing"]
          PY
