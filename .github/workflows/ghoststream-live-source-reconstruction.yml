name: GhostStream live source reconstruction

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ghoststream-pilot
    paths:
      - pilots/ghoststream/reconstruction/audit_live_gmn_source.py
      - pilots/ghoststream/april_stream/mdc/GhostStream_April_95_GMN_lookup.csv
      - .github/workflows/ghoststream-live-source-reconstruction.yml

permissions:
  contents: write

concurrency:
  group: ghoststream-live-source-reconstruction
  cancel-in-progress: false

jobs:
  reconnect-live-gmn-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ghoststream-pilot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile reconstruction audit
        run: |
          python -m py_compile pilots/ghoststream/reconstruction/audit_live_gmn_source.py

      - name: Reconnect committed lookup to official GMN source
        run: |
          python pilots/ghoststream/reconstruction/audit_live_gmn_source.py \
            2>&1 | tee ghoststream_live_source_reconstruction.log

      - name: Validate outputs
        run: |
          python -m json.tool \
            pilots/ghoststream/reconstruction/live_source_audit/live_gmn_source_audit.json \
            >/dev/null
          test -s pilots/ghoststream/reconstruction/live_source_audit/gmn_reconnected_95_source_records.csv
          test -s pilots/ghoststream/reconstruction/live_source_audit/gmn_broad_nonorbital_neighbourhood.csv
          grep -F '**Status: PASS**' \
            pilots/ghoststream/reconstruction/live_source_audit/LIVE_GMN_SOURCE_AUDIT.md

      - name: Upload reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: ghoststream-live-source-reconstruction
          path: |
            pilots/ghoststream/reconstruction/live_source_audit/
            ghoststream_live_source_reconstruction.log
          if-no-files-found: error
          retention-days: 90

      - name: Commit immutable reconstruction outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pilots/ghoststream/reconstruction/live_source_audit
          if git diff --cached --quiet; then
            echo "No reconstruction output changes to commit."
          else
            git commit -m "Record live GMN source reconstruction audit"
            git push origin HEAD:agent/ghoststream-pilot
          fi
